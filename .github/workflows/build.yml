name: Build dylib
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build
        run: make

      - name: Collect dylib
        run: |
          mkdir out
          cp .theos/obj/debug/BGToggle.dylib out/BGToggle.dylib
          codesign --remove-signature out/BGToggle.dylib
          file out/BGToggle.dylib
          ls -la out


      - uses: actions/upload-artifact@v4
        with:
          name: BGToggle-dylib
          path: out/BGToggle.dylib
