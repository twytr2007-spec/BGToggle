name: Build dylib
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir out
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc \
            -miphoneos-version-min=13.0 \
            -framework Foundation -framework UIKit -framework AVFoundation \
            -framework CoreGraphics -framework QuartzCore \
            -Wl,-headerpad_max_install_names \
            -install_name @rpath/BGToggle.dylib \
            -o out/BGToggle.dylib Tweak.m
          codesign --remove-signature out/BGToggle.dylib || true
          otool -L out/BGToggle.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: BGToggle-dylib
          path: out/BGToggle.dylib
